      <div class="view" id="view-clinica-perfil">
        <div class="card" style="margin-bottom:20px">
          <div class="card-header"><span class="card-title">Dados da Clínica</span></div>
          <div class="form-row">
            <div class="form-group"><label>Razão Social</label><input id="clinic-name" class="form-input"></div>
            <div class="form-group"><label>CNPJ</label><input id="clinic-cnpj" class="form-input"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Telefone</label><input id="clinic-phone" class="form-input"></div>
            <div class="form-group"><label>E-mail</label><input id="clinic-email" class="form-input" readonly></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Endereço</label><input id="clinic-address" class="form-input"></div>
            <div class="form-group"><label>CEP</label><input id="clinic-cep" class="form-input"></div>
          </div>
          <button class="btn-primary" onclick="saveClinicProfile()">Salvar alterações</button>
        </div>
      </div>
