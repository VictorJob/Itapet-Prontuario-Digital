      <div class="view" id="view-consultas">
        <div class="grid-2 consultations-layout" style="margin-bottom:24px">
          <div class="card" data-role-clinica-only>
            <div class="card-header">
              <span class="card-title">Agendar Consulta</span>
            </div>
            <div class="form-group">
              <label>Pet</label>
              <select id="appointment-pet" class="form-input"></select>
            </div>
            <div class="form-group">
              <label>Veterinário</label>
              <select id="appointment-vet" class="form-input"></select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Nome do responsável</label>
                <input id="appointment-owner" class="form-input" placeholder="Nome completo">
              </div>
              <div class="form-group">
                <label>Telefone do responsável</label>
                <input id="appointment-phone" class="form-input" type="tel" placeholder="(11) 99999-9999">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Data</label>
                <input id="appointment-date" type="date" class="form-input">
              </div>
              <div class="form-group">
                <label>Horário</label>
                <select id="appointment-time" class="form-input">
                  <option>09:00</option><option>10:00</option><option>11:00</option>
                  <option selected>14:00</option><option>15:00</option><option>16:00</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Tipo de Consulta</label>
              <select id="appointment-type" class="form-input">
                <option>Consulta de rotina</option><option>Vacinação</option>
                <option>Retorno</option><option>Emergência</option><option>Exame</option>
              </select>
            </div>
            <div class="form-group">
              <label>Observações</label>
              <textarea id="appointment-details" class="form-input" rows="2" placeholder="Sintomas ou motivo da consulta..."></textarea>
            </div>
            <button class="btn-primary" onclick="scheduleAppointment()">Confirmar Agendamento</button>
          </div>

          <div>
            <div class="card" style="margin-bottom:16px">
              <div class="card-header">
                <span class="card-title">Próximas Consultas</span>
              </div>
              <div id="upcoming-appointments"></div>
            </div>

            <div class="card">
              <div class="card-header"><span class="card-title">Consultas Passadas</span></div>
              <div id="past-appointments"></div>
            </div>
          </div>
        </div>
      </div>
